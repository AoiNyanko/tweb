name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      VITE_API_ID: ${{ vars.VITE_API_ID }}
      VITE_API_HASH: ${{ secrets.VITE_API_HASH }}
      VITE_PUSH_SERVER_KEY: ${{ vars.VITE_PUSH_SERVER_KEY }}
      VITE_SITE_TITLE: ${{ vars.VITE_SITE_TITLE }}
      VITE_SITE_DESCRIPTION: ${{ vars.VITE_SITE_DESCRIPTION }}
      VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
      VITE_PUBLIC_BASE_PATH: ${{ vars.VITE_PUBLIC_BASE_PATH }}
      VITE_MTPROTO_PROXY_ORIGIN: ${{ vars.VITE_MTPROTO_PROXY_ORIGIN }}
      VITE_MTPROTO_PROXY_PATH: ${{ vars.VITE_MTPROTO_PROXY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.3
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install pnpm -g
          export SHELL='/usr/bin/bash'
          hash -r
          pnpm setup
          pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Prepare Pages artifact
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
